<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FONBEC{% endblock %}</title>
    <style>
        /* ---- Reset & Base ---- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f0f2f5;
            color: #1a1a2e;
            line-height: 1.6;
        }

        /* ---- Header / Navigation ---- */
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        header .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #e94560;
        }

        header nav a {
            color: #b0b0c0;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        header nav a:hover {
            color: #ffffff;
        }

        /* ---- Main Content ---- */
        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* ---- Footer ---- */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #888;
            font-size: 0.85rem;
            margin-top: 3rem;
        }

        /* ---- Utilities ---- */
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            margin-bottom: 1.5rem;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #16213e;
            border-bottom: 2px solid #e94560;
            padding-bottom: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }
        .badge-incomplete { background: #e2e3e5; color: #383d41; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <span class="logo">FONBEC</span>
        <nav>
            <a href="/becario/academico">Datos Académicos</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2026 FONBEC &mdash; Sistema de Gestión de Becas
    </footer>
</body>
</html>
