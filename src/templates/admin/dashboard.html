{% extends "layouts/base.html" %}

{% block title %}Panel de Administración — FONBEC{% endblock %}

{% block content %}
<div class="header bg-gradient-primary pb-6 pt-5 pt-md-6">
  <div class="container-fluid">
    <div class="header-body">
      <h6 class="h2 text-white d-inline-block mb-0">Panel Principal</h6>
    </div>
  </div>
</div>

<div class="container-fluid mt--5">
  <div class="row">
    <div class="col">
      <div class="card shadow">
        <div class="card-header border-0">
          <h3 class="mb-0">Resumen del Sistema</h3>
        </div>
        <div class="card-body">
          <p class="text-muted text-center mt-3">
            Módulo en construcción. Aquí se mostrarán estadísticas completas en el futuro.
          </p>
        </div>
      </div>

      <div class="row mt-4 justify-content-center">
        <div class="col-lg-4 col-md-6 text-center">
          <a href="{{ url_for('admin.invitar_usuario') }}" class="btn btn-icon btn-primary btn-block py-4 shadow-sm">
            <span class="btn-inner--icon"><i class="ni ni-send fa-2x mb-2 d-block"></i></span>
            <span class="btn-inner--text font-weight-bold">Invitar Nuevo Usuario</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
